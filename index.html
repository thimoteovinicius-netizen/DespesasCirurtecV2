<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Despesas Cirurtec</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  font-family:'Inter',sans-serif;
  background:#f6f8fb;
  padding:15px;
  color:#2c3e50;
}

.header{text-align:center;margin-bottom:20px;}
.header img{max-width:160px;margin-bottom:6px;}
.header h1{font-size:18px;color:#1976d2;}

.card{
  background:#fff;
  padding:18px;
  border-radius:18px;
  margin-bottom:15px;
  box-shadow:0 6px 16px rgba(0,0,0,0.06);
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #e0e4ea;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  cursor:pointer;
}

.btn-primary{background:#1976d2;color:#fff;}
.btn-sec{background:#e3f2fd;color:#1976d2;}
.btn-del{background:#fdecea;color:#c62828;}

.hidden{display:none;}

.despesa,.anexo{
  background:#f9fafb;
  border-radius:12px;
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
  <img src="1000644584.png">
  <h1>Despesas Cirurtec</h1>
</div>

<div class="card">
  <input id="nome" placeholder="Nome do técnico">
  <input id="email" placeholder="E-mail">
</div>

<div class="card">
  <label>Data início</label>
  <input type="datetime-local" id="dataInicio">
  <label>Data final</label>
  <input type="datetime-local" id="dataFim">
  <input type="number" id="adiantamento" placeholder="Adiantamento (R$)">
</div>

<div class="card">
  <h3>Trajeto</h3>
  <input id="origem" placeholder="Origem">
  <button class="btn-sec" onclick="addParada()">+ Parada</button>
  <div id="paradas"></div>
  <input id="destino" placeholder="Destino">
</div>

<div class="card">
  <h3>Nova despesa</h3>

  <select id="categoria" onchange="controleCategoria()">
    <option value="">Categoria</option>
    <option>Alimentação</option>
    <option>Bônus de viagem</option>
    <option>Veículo próprio</option>
    <option>Combustível</option>
    <option>Pedágios</option>
    <option>Peças</option>
    <option>Hospedagem</option>
    <option>Outros</option>
  </select>

  <select id="sub" class="hidden" onchange="calcularValor()">
    <option value="">Refeição</option>
    <option>Almoço</option>
    <option>Café da tarde</option>
    <option>Jantar</option>
  </select>

  <input type="number" id="qtd" class="hidden" placeholder="Quantidade" oninput="calcularValor()">
  <input id="outros" class="hidden" placeholder="Descrição">

  <input id="valor" type="number" placeholder="Valor (R$)" readonly>

  <button class="btn-primary" onclick="addDespesa()">Adicionar</button>
</div>

<div class="card">
  <h3>Despesas</h3>
  <div id="lista"></div>
</div>

<div class="card">
  <h3>Anexos</h3>

  <button class="btn-sec" onclick="camera.click()">📸 Câmera</button>
  <input id="camera" type="file" accept="image/*" capture="environment" multiple hidden>

  <button class="btn-sec" onclick="galeria.click()">🖼️ Galeria</button>
  <input id="galeria" type="file" accept="image/*" multiple hidden>

  <div id="listaAnexos"></div>
</div>

<div class="card">
  <textarea id="observacoes" placeholder="Observações"></textarea>
</div>

<div class="card">
  <button class="btn-primary" onclick="finalizar()">Gerar PDF</button>
</div>

<script>

let despesas=[], anexos=[];

// ... (todo resto permanece igual)

async function finalizar(){

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();

  let y=10,total=0;
  const ad = Number(adiantamento.value)||0;

  // ... (toda parte anterior igual)

  if(anexos.length){
    pdf.addPage();
    y=10;

    for (const a of anexos) {

      const img = new Image();
      img.src = a.img;

      await new Promise(resolve => {
        img.onload = resolve;
      });

      // 🔽 REDIMENSIONAMENTO + QUALIDADE + ESCALA DE CINZA
      const canvas = document.createElement("canvas");
      const maxWidth = 1000;
      const scale = maxWidth / img.width;

      canvas.width = maxWidth;
      canvas.height = img.height * scale;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // 🔽 escala de cinza (ideal pra cupom)
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] + data[i+1] + data[i+2]) / 3;
        data[i] = data[i+1] = data[i+2] = avg;
      }

      ctx.putImageData(imageData, 0, 0);

      const imgFinal = canvas.toDataURL("image/jpeg", 0.85);

      const largura = 180;
      const altura = (canvas.height / canvas.width) * largura;

      if (y + altura > 280) {
        pdf.addPage();
        y = 10;
      }

      pdf.addImage(imgFinal,"JPEG",15,y,largura,altura);

      if(a.desc){
        pdf.text(a.desc,15,y+altura+5);
        y+=altura+15;
      }else{
        y+=altura+10;
      }
    }
  }

  pdf.save("Despesas_Cirurtec.pdf");
}

</script>

</body>
</html>
