<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solicitação de Viagem</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:15px;
  background:#f4f7fb;
  font-family:'Inter',sans-serif;
  color:#2c3e50;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  color:#1565c0;
  font-size:26px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.06);
}

.card h3{
  margin-top:0;
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:14px;
  font-weight:600;
}

input,
select,
button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #dbe3ec;
  margin-top:8px;
  font-size:15px;
}

button{
  border:none;
  cursor:pointer;
  font-weight:600;
}

.btn-primary{
  background:#1565c0;
  color:#fff;
}

.btn-secondary{
  background:#e3f2fd;
  color:#1565c0;
}

.info{
  background:#f8fafc;
  border-radius:14px;
  padding:15px;
  line-height:1.9;
  margin-top:15px;
}

.total{
  font-size:22px;
  font-weight:bold;
  color:#1565c0;
}

.parada-box{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.parada-box input{
  margin-top:0;
}

.btn-remover{
  width:auto;
  background:#fdecea;
  color:#c62828;
  padding:0 14px;
}

.alimentacao-detalhe{
  margin-left:10px;
  font-size:14px;
  color:#555;
}

hr{
  border:none;
  border-top:1px solid #dbe3ec;
  margin:15px 0;
}

</style>

</head>

<body>

<div class="header">

  <h1>Solicitação de Viagem</h1>

</div>

<div class="card">

  <h3>Dados do Técnico</h3>

  <label>Nome</label>
  <input id="nome">

  <label>E-mail</label>
  <input id="email">

</div>

<div class="card">

  <h3>Período da Viagem</h3>

  <label>Data início</label>
  <input type="datetime-local" id="dataInicio">

  <label>Data final</label>
  <input type="datetime-local" id="dataFim">

  <label>Tipo de veículo</label>

  <select id="tipoVeiculo">

    <option value="">
      Selecione
    </option>

    <option value="1.28">
      Veículo próprio (R$ 1,28/km)
    </option>

    <option value="0.70">
      Veículo empresa (R$ 0,70/km)
    </option>

  </select>

</div>

<div class="card">

  <h3>Trajeto</h3>

  <label>Origem</label>

  <input
    id="origem"
    placeholder="Cidade origem"
  >

  <button
    class="btn-secondary"
    onclick="addParada()"
  >
    + Adicionar parada
  </button>

  <div id="paradas"></div>

  <label>Destino</label>

  <input
    id="destino"
    placeholder="Cidade destino"
  >

  <button
    class="btn-secondary"
    onclick="abrirGoogleMaps()"
  >
    Abrir rota no Google Maps
  </button>

  <label>KM total da viagem</label>

  <input
    type="number"
    id="kmManual"
    placeholder="Digite os KM da rota"
    oninput="calcularCustos()"
  >

  <label>Valor pedágios</label>

  <input
    type="number"
    id="pedagioManual"
    placeholder="Digite o valor total dos pedágios"
    oninput="calcularCustos()"
  >

</div>

<div class="card">

  <h3>Alimentação</h3>

  <label>Almoço (R$10)</label>
  <input id="almoco" readonly>

  <label>Jantar (R$40)</label>
  <input id="jantar" readonly>

  <label>Café (R$10)</label>
  <input id="cafe" readonly>

</div>

<div class="card">

  <h3>Hospedagem</h3>

  <input
    type="number"
    id="hospedagem"
    oninput="calcularCustos()"
  >

</div>

<div class="card">

  <h3>Valor Extra</h3>

  <input
    type="number"
    id="valorExtra"
    oninput="calcularCustos()"
  >

</div>

<div class="card">

  <h3>Resumo</h3>

  <div class="info">

    <div>
      KM:
      <strong id="resumoKm">
        0 km
      </strong>
    </div>

    <div>
      Valor KM:
      <strong id="resumoValorKm">
        R$ 0,00
      </strong>
    </div>

    <div>
      Pedágios:
      <strong id="resumoPedagio">
        R$ 0,00
      </strong>
    </div>

    <div>
      Alimentação:
      <strong id="resumoAlimentacao">
        R$ 0,00
      </strong>

      <div class="alimentacao-detalhe">
        Almoço:
        <span id="valorAlmocoResumo">
          R$ 0,00
        </span>
      </div>

      <div class="alimentacao-detalhe">
        Jantar:
        <span id="valorJantarResumo">
          R$ 0,00
        </span>
      </div>

      <div class="alimentacao-detalhe">
        Café:
        <span id="valorCafeResumo">
          R$ 0,00
        </span>
      </div>

    </div>

    <div>
      Hospedagem:
      <strong id="resumoHospedagem">
        R$ 0,00
      </strong>
    </div>

    <div>
      Extra:
      <strong id="resumoExtra">
        R$ 0,00
      </strong>
    </div>

    <hr>

    <div class="total">

      Total:
      <span id="totalDeposito">
        R$ 0,00
      </span>

    </div>

  </div>

</div>

<div class="card">

  <button
    class="btn-primary"
    onclick="gerarPDF()"
  >
    Gerar PDF
  </button>

  <button
    class="btn-secondary"
    style="margin-top:10px"
    onclick="copiarCalculos()"
  >
    Copiar cálculos
  </button>

</div>

<script>

const valorAlmoco = 10;
const valorJantar = 40;
const valorCafe = 10;

function moeda(valor){

  return Number(valor).toLocaleString(
    'pt-BR',
    {
      style:'currency',
      currency:'BRL'
    }
  );

}

function addParada(){

  const container =
    document.getElementById("paradas");

  const div =
    document.createElement("div");

  div.className =
    "parada-box";

  div.innerHTML = `

    <input
      type="text"
      class="parada"
      placeholder="Cidade parada"
    >

    <button
      class="btn-remover"
      onclick="this.parentElement.remove()"
    >
      X
    </button>

  `;

  container.appendChild(div);

}

function abrirGoogleMaps(){

  const origem =
    document.getElementById("origem").value;

  const destino =
    document.getElementById("destino").value;

  if(!origem || !destino){

    alert(
      "Informe origem e destino"
    );

    return;

  }

  let url =
    `https://www.google.com/maps/dir/${encodeURIComponent(origem)}`;

  document
  .querySelectorAll(".parada")
  .forEach(parada=>{

    if(parada.value.trim()){

      url += `/${encodeURIComponent(parada.value.trim())}`;

    }

  });

  url += `/${encodeURIComponent(destino)}`;

  window.open(url,"_blank");

}

function calcularCustos(){

  const kmTotal =
    Number(
      document.getElementById(
        "kmManual"
      ).value
    ) || 0;

  const pedagios =
    Number(
      document.getElementById(
        "pedagioManual"
      ).value
    ) || 0;

  const tipoVeiculo =
    Number(
      document.getElementById(
        "tipoVeiculo"
      ).value
    ) || 0;

  const custoKm =
    kmTotal * tipoVeiculo;

  document.getElementById(
    "resumoKm"
  ).innerText =
    kmTotal.toFixed(1) + " km";

  document.getElementById(
    "resumoValorKm"
  ).innerText =
    moeda(custoKm);

  document.getElementById(
    "resumoPedagio"
  ).innerText =
    moeda(pedagios);

  const inicio =
    document.getElementById(
      "dataInicio"
    ).value;

  const fim =
    document.getElementById(
      "dataFim"
    ).value;

  let qtdAlmoco = 0;
  let qtdCafe = 0;
  let qtdJanta = 0;

  if(inicio && fim){

    const dataInicio =
      new Date(inicio);

    const dataFim =
      new Date(fim);

    const dias =
      Math.floor(
        (
          dataFim - dataInicio
        ) /
        (1000*60*60*24)
      );

    const horaSaida =
      dataInicio.getHours();

    const minutoSaida =
      dataInicio.getMinutes();

    const horaChegada =
      dataFim.getHours();

    if(dias === 0){

      qtdCafe = 1;

      if(
        horaSaida < 11 ||
        (
          horaSaida === 11 &&
          minutoSaida <= 30
        )
      ){
        qtdAlmoco = 1;
      }

      if(horaChegada >= 19){
        qtdJanta = 1;
      }

    }else{

      qtdCafe = dias + 1;
      qtdAlmoco = dias + 1;
      qtdJanta = dias;

      if(horaChegada >= 19){
        qtdJanta += 1;
      }

    }

  }

  document.getElementById(
    "almoco"
  ).value =
    qtdAlmoco;

  document.getElementById(
    "jantar"
  ).value =
    qtdJanta;

  document.getElementById(
    "cafe"
  ).value =
    qtdCafe;

  const totalAlmoco =
    qtdAlmoco * valorAlmoco;

  const totalJantar =
    qtdJanta * valorJantar;

  const totalCafe =
    qtdCafe * valorCafe;

  const alimentacao =
    totalAlmoco +
    totalJantar +
    totalCafe;

  document.getElementById(
    "valorAlmocoResumo"
  ).innerText =
    moeda(totalAlmoco);

  document.getElementById(
    "valorJantarResumo"
  ).innerText =
    moeda(totalJantar);

  document.getElementById(
    "valorCafeResumo"
  ).innerText =
    moeda(totalCafe);

  document.getElementById(
    "resumoAlimentacao"
  ).innerText =
    moeda(alimentacao);

  const hospedagem =
    Number(
      document.getElementById(
        "hospedagem"
      ).value
    ) || 0;

  const extra =
    Number(
      document.getElementById(
        "valorExtra"
      ).value
    ) || 0;

  document.getElementById(
    "resumoHospedagem"
  ).innerText =
    moeda(hospedagem);

  document.getElementById(
    "resumoExtra"
  ).innerText =
    moeda(extra);

  const total =
    custoKm +
    pedagios +
    alimentacao +
    hospedagem +
    extra;

  document.getElementById(
    "totalDeposito"
  ).innerText =
    moeda(total);

}

[
  "tipoVeiculo",
  "dataInicio",
  "dataFim"
]
.forEach(id=>{

  document
  .getElementById(id)
  .addEventListener(
    "input",
    calcularCustos
  );

});

function copiarCalculos(){

  const texto = `

SOLICITAÇÃO DE VIAGEM

Técnico:
${document.getElementById("nome").value}

KM:
${document.getElementById("resumoKm").innerText}

Valor KM:
${document.getElementById("resumoValorKm").innerText}

Pedágios:
${document.getElementById("resumoPedagio").innerText}

Almoço:
${document.getElementById("valorAlmocoResumo").innerText}

Jantar:
${document.getElementById("valorJantarResumo").innerText}

Café:
${document.getElementById("valorCafeResumo").innerText}

Hospedagem:
${document.getElementById("resumoHospedagem").innerText}

Extra:
${document.getElementById("resumoExtra").innerText}

TOTAL:
${document.getElementById("totalDeposito").innerText}

`;

  navigator.clipboard.writeText(texto);

  alert("Cálculos copiados!");

}

function gerarPDF(){

  const { jsPDF } =
    window.jspdf;

  const pdf =
    new jsPDF();

  let y = 20;

  pdf.setFontSize(16);

  pdf.text(
    "Solicitação de Viagem",
    10,
    y
  );

  y += 12;

  pdf.setFontSize(11);

  const linhas = [

    `Técnico: ${document.getElementById("nome").value}`,
    `KM: ${document.getElementById("resumoKm").innerText}`,
    `Valor KM: ${document.getElementById("resumoValorKm").innerText}`,
    `Pedágios: ${document.getElementById("resumoPedagio").innerText}`,
    `Almoço: ${document.getElementById("valorAlmocoResumo").innerText}`,
    `Jantar: ${document.getElementById("valorJantarResumo").innerText}`,
    `Café: ${document.getElementById("valorCafeResumo").innerText}`,
    `Hospedagem: ${document.getElementById("resumoHospedagem").innerText}`,
    `Extra: ${document.getElementById("resumoExtra").innerText}`,
    `TOTAL: ${document.getElementById("totalDeposito").innerText}`

  ];

  linhas.forEach(linha=>{

    pdf.text(linha,10,y);

    y += 8;

  });

  pdf.save(
    "Solicitacao_Viagem.pdf"
  );

}

</script>

</body>
</html>
