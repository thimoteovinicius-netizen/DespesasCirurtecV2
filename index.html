<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frota Pro - Sistema</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:15px;}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;}
input,select,textarea{width:100%;padding:8px;margin-top:5px;border-radius:8px;}
button{width:100%;padding:12px;margin-top:10px;background:#1976d2;color:#fff;border:none;border-radius:10px;}
.hidden{display:none;}
.item{padding:8px;background:#eee;margin-top:6px;border-radius:8px;}
</style>
</head>

<body>

<h2>🚗 Frota Pro</h2>

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h3>Login por Veículo</h3>

  <select id="veiculoLogin"></select>
  <input id="senhaLogin" placeholder="Senha">

  <button onclick="login()">Entrar</button>
</div>

<!-- CADASTRO -->
<div class="card">
  <h3>Cadastrar Veículo</h3>
  <input id="novoVeiculo" placeholder="Placa / Nome">
  <input id="usuario" placeholder="Responsável">
  <input id="senha" placeholder="Senha">
  <button onclick="addVeiculo()">Cadastrar</button>
</div>

<!-- SISTEMA -->
<div id="sistema" class="hidden">

<div class="card">
  <h3 id="infoVeiculo"></h3>
</div>

<div class="card" id="checklist"></div>

<div class="card">
  <button onclick="salvarChecklist()">Salvar Checklist</button>
</div>

<div class="card">
  <h3>Histórico</h3>
  <div id="historico"></div>
</div>

</div>

<script>

// DADOS
let veiculos = JSON.parse(localStorage.getItem("veiculos")||"[]");
let atual = null;

const itens = [
"TRANCAS","DOCUMENTO","CINTO","FREIO","BUZINA",
"PNEUS","LUZES","ÓLEO","RADIADOR","LIMPEZA"
];

// RENDER LOGIN
function renderLogin(){
  veiculoLogin.innerHTML = veiculos.map(v=>`<option>${v.nome}</option>`).join("");
}
renderLogin();

// CADASTRO
function addVeiculo(){
  veiculos.push({
    nome:novoVeiculo.value,
    usuario:usuario.value,
    senha:senha.value,
    historico:[]
  });

  localStorage.setItem("veiculos",JSON.stringify(veiculos));
  renderLogin();

  alert("Veículo cadastrado!");
}

// LOGIN
function login(){
  let v = veiculos.find(v=>v.nome===veiculoLogin.value && v.senha===senhaLogin.value);

  if(!v) return alert("Senha incorreta");

  atual = v;

  loginBox.classList.add("hidden");
  sistema.classList.remove("hidden");

  infoVeiculo.innerText = `Veículo: ${v.nome} | Responsável: ${v.usuario}`;

  renderChecklist();
  renderHistorico();
}

// CHECKLIST
function renderChecklist(){
  checklist.innerHTML="";

  itens.forEach((item,i)=>{
    checklist.innerHTML+=`
      <div>
        <label>${item}</label>
        <select id="i${i}">
          <option>Aprovado</option>
          <option>Reprovado</option>
        </select>
        <textarea id="obs${i}" placeholder="Observação"></textarea>
      </div>
    `;
  });
}

// SALVAR
function salvarChecklist(){

  let dados = itens.map((item,i)=>({
    item,
    status:document.getElementById("i"+i).value,
    obs:document.getElementById("obs"+i).value
  }));

  atual.historico.push({
    data:new Date().toLocaleString(),
    dados
  });

  localStorage.setItem("veiculos",JSON.stringify(veiculos));

  renderHistorico();

  alert("Salvo com sucesso!");
}

// HISTÓRICO
function renderHistorico(){

  historico.innerHTML="";

  atual.historico.forEach(h=>{
    historico.innerHTML+=`
      <div class="item">
        ${h.data}
      </div>
    `;
  });
}

</script>

</body>
</html>
