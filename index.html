<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora Termodinâmica</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  color:#fff;
  padding:20px;
}

.container{
  max-width:500px;
  margin:auto;
  background:#1e293b;
  padding:20px;
  border-radius:12px;
}

h1{text-align:center;}

label{display:block;margin-top:15px;}

input, select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:5px;
}

button{
  margin-top:20px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.result{
  margin-top:20px;
  padding:15px;
  background:#020617;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
<h1>Calculadora Termodinâmica</h1>

<label>Fluido</label>
<select id="fluido">
  <option value="agua">Água</option>
  <option value="etanol">Etanol</option>
  <option value="metanol">Metanol</option>
  <option value="isopropanol">Isopropanol</option>
</select>

<label>Temperatura (°C)</label>
<input type="number" id="temp" oninput="calcFromTemp()">

<label>Pressão (bar)</label>
<input type="number" id="press" oninput="calcFromPress()">

<div class="result" id="resultado">
Aguardando entrada...
</div>

<button onclick="gerarPDF()">Gerar PDF</button>

</div>

<script>

// Base de dados Antoine
const fluidos = {
  agua: {A:8.14019, B:1810.94, C:244.485},
  etanol: {A:8.20417, B:1642.89, C:230.300},
  metanol: {A:8.08097, B:1582.27, C:239.726},
  isopropanol: {A:8.11778, B:1580.92, C:219.620}
};

function getConstantes(){
  const f = document.getElementById("fluido").value;
  return fluidos[f];
}

function tempToPressure(T){
  const {A,B,C} = getConstantes();
  const P_mmHg = 10**(A - (B/(T + C)));
  return P_mmHg * 0.00133322;
}

function pressureToTemp(P){
  let Tmin=0, Tmax=200, Tmid;

  for(let i=0;i<40;i++){
    Tmid=(Tmin+Tmax)/2;
    const Pcalc=tempToPressure(Tmid);

    if(Pcalc > P){
      Tmax=Tmid;
    }else{
      Tmin=Tmid;
    }
  }

  return Tmid;
}

function calcFromTemp(){
  const T = Number(temp.value);
  if(isNaN(T)) return;

  const P = tempToPressure(T);
  press.value = P.toFixed(3);

  mostrarResultado(T,P);
}

function calcFromPress(){
  const P = Number(press.value);
  if(isNaN(P)) return;

  const T = pressureToTemp(P);
  temp.value = T.toFixed(1);

  mostrarResultado(T,P);
}

function mostrarResultado(T,P){
  const fluido = document.getElementById("fluido").selectedOptions[0].text;

  document.getElementById("resultado").innerHTML = `
    <b>Resultado:</b><br>
    Fluido: ${fluido}<br>
    Temperatura: ${T.toFixed(2)} °C<br>
    Pressão: ${P.toFixed(3)} bar<br><br>
    <small>Base: Equação de Antoine</small>
  `;
}

function gerarPDF(){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  const T = temp.value;
  const P = press.value;
  const fluido = document.getElementById("fluido").selectedOptions[0].text;

  pdf.text("Relatório Termodinâmico", 10, 10);
  pdf.text(`Fluido: ${fluido}`, 10, 20);
  pdf.text(`Temperatura: ${T} °C`, 10, 30);
  pdf.text(`Pressão: ${P} bar`, 10, 40);

  pdf.save("relatorio_termodinamico.pdf");
}

</script>

</body>
</html>
