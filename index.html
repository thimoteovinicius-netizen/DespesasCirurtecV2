<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de frota Cirurtec</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:15px;}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;}
input,select,textarea{width:100%;padding:8px;margin-top:5px;border-radius:8px;}
button{width:100%;padding:12px;margin-top:10px;background:#1976d2;color:#fff;border:none;border-radius:10px;}
.hidden{display:none;}
.item{background:#eee;padding:10px;margin-top:6px;border-radius:8px;cursor:pointer;}
.detalhe{background:#fafafa;padding:10px;margin-top:10px;border-radius:8px;}
img{width:100%;margin-top:5px;border-radius:8px;}
</style>
</head>

<body>

<h2>🚗 Sistema de Frota</h2>

<!-- LOGIN -->
<div class="card" id="loginBox">
  <h3>Login</h3>
  <select id="veiculoLogin"></select>
  <input id="senhaLogin" placeholder="Placa">
  <button onclick="login()">Entrar</button>
</div>

<!-- CADASTRO -->
<div class="card">
  <h3>Cadastrar Veículo</h3>
  <input id="modelo" placeholder="Modelo">
  <input id="placa" placeholder="Placa">
  <button onclick="cadastrar()">Cadastrar</button>
</div>

<!-- SISTEMA -->
<div id="sistema" class="hidden">

<div class="card">
  <h3 id="info"></h3>
</div>

<div class="card">
  <input id="motorista" placeholder="Motorista do dia">
  <input type="date" id="data">
</div>

<div class="card" id="checklist"></div>

<div class="card">
  <h3>Fotos</h3>
  <input type="file" id="fotos" multiple>
</div>

<div class="card">
  <button onclick="salvar()">Salvar Checklist</button>
</div>

<div class="card">
  <h3>Últimos 10 registros</h3>
  <div id="historico"></div>
</div>

<div class="card">
  <h3>Detalhes do Checklist</h3>
  <div id="detalhe"></div>
</div>

</div>

<script>

let veiculos = JSON.parse(localStorage.getItem("veiculos")||"[]");
let atual = null;

const itens = [
"TRANCAS","DOCUMENTO","CINTO","FREIO","BUZINA",
"PNEUS","LUZES","ÓLEO","RADIADOR","LIMPEZA"
];

// LOGIN
function renderLogin(){
  veiculoLogin.innerHTML = veiculos.map(v=>`<option>${v.modelo}</option>`).join("");
}
renderLogin();

function cadastrar(){
  veiculos.push({
    modelo:modelo.value,
    placa:placa.value,
    historico:[]
  });

  localStorage.setItem("veiculos",JSON.stringify(veiculos));
  renderLogin();
  alert("Veículo cadastrado!");
}

function login(){
  let v = veiculos.find(v=>v.modelo===veiculoLogin.value && v.placa===senhaLogin.value);
  if(!v) return alert("Erro no login");

  atual = v;

  loginBox.classList.add("hidden");
  sistema.classList.remove("hidden");

  info.innerText = `Veículo: ${v.modelo}`;

  renderChecklist();
  renderHistorico();
}

// CHECKLIST
function renderChecklist(){
  checklist.innerHTML="";
  itens.forEach((item,i)=>{
    checklist.innerHTML+=`
      <div>
        <label>${item}</label>
        <select id="i${i}">
          <option>Aprovado</option>
          <option>Reprovado</option>
        </select>
        <textarea id="obs${i}" placeholder="Observação"></textarea>
      </div>
    `;
  });
}

// SALVAR
function salvar(){

  let dados = itens.map((item,i)=>{

    let status = document.getElementById("i"+i).value;
    let obs = document.getElementById("obs"+i).value;

    if(status==="Reprovado" && !obs){
      alert("Preencha observação em: "+item);
      throw "erro";
    }

    return {item,status,obs};
  });

  let fotosArray = [];

  const arquivos = [...fotos.files];
  let lidos = 0;

  if(arquivos.length === 0){
    finalizarSave(dados, fotosArray);
    return;
  }

  arquivos.forEach(f=>{
    const reader = new FileReader();
    reader.onload = e=>{
      fotosArray.push(e.target.result);
      lidos++;

      if(lidos === arquivos.length){
        finalizarSave(dados, fotosArray);
      }
    }
    reader.readAsDataURL(f);
  });
}

function finalizarSave(dados, fotosArray){

  atual.historico.unshift({
    motorista:motorista.value,
    data:data.value,
    dados,
    fotos:fotosArray
  });

  atual.historico = atual.historico.slice(0,10);

  localStorage.setItem("veiculos",JSON.stringify(veiculos));

  renderHistorico();

  alert("Checklist salvo!");
}

// HISTÓRICO
function renderHistorico(){

  historico.innerHTML="";

  atual.historico.forEach((h,i)=>{
    historico.innerHTML+=`
      <div class="item" onclick="abrir(${i})">
        ${h.data} - ${h.motorista}
      </div>
    `;
  });
}

// ABRIR DETALHE
function abrir(i){

  let h = atual.historico[i];

  detalhe.innerHTML = `
    <div class="detalhe">
      <b>Motorista:</b> ${h.motorista}<br>
      <b>Data:</b> ${h.data}<br><br>
    </div>
  `;

  h.dados.forEach(d=>{
    detalhe.innerHTML += `
      <div class="detalhe">
        ${d.item}: ${d.status}<br>
        ${d.obs ? "Obs: "+d.obs : ""}
      </div>
    `;
  });

  h.fotos.forEach(img=>{
    detalhe.innerHTML += `<img src="${img}">`;
  });
}

</script>

</body>
</html>
