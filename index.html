<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checklist Veicular</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;background:#f4f6f9;padding:15px;}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;}
input,select,textarea{width:100%;padding:8px;margin-top:5px;border-radius:8px;}
button{width:100%;padding:12px;margin-top:10px;background:#1976d2;color:#fff;border:none;border-radius:10px;}
.item{padding:10px;margin-top:6px;border-radius:8px;}
.aprovado{background:#e8f5e9;}
.reprovado{background:#fdecea;}
.na{background:#eeeeee;}
img{width:100%;margin-top:5px;border-radius:8px;}
</style>
</head>

<body>

<h2>🚗 Checklist Veicular</h2>

<div class="card">

<label>Tipo de Checklist</label>
<select id="tipo">
  <option value="">Selecione</option>
  <option>Check list inicial</option>
  <option>Check list final</option>
</select>

<input id="usuario" placeholder="Nome do usuário">
<input id="veiculo" placeholder="Veículo">
<input id="placa" placeholder="Placa">
<input id="km" type="number" placeholder="KM do veículo">

<input type="datetime-local" id="dataHora">
<input id="local" placeholder="Local da vistoria">

</div>

<div class="card" id="checklist"></div>

<div class="card">
<h3>Fotos</h3>
<input type="file" id="fotos" multiple accept="image/*" onchange="previewFotos()">
<div id="preview"></div>
</div>

<div class="card">
<textarea id="obsFinal" maxlength="50" placeholder="Observação final (máx 50 caracteres)"></textarea>
</div>

<div class="card">
<button onclick="resumo()">👁 Visualizar Resumo</button>
<button onclick="gerarPDF()">📄 Gerar e Baixar PDF</button>
<button onclick="enviar()">📤 Enviar</button>
</div>

<div class="card">
<h3>Resumo</h3>
<div id="resumoBox"></div>
</div>

<script>

const itens = [
"TRANCAS E ALARMES","DOCUMENTO DO VEÍCULO","CINTO DE SEGURANÇA",
"FREIO DE MÃO","BUZINA","MACACO MECÂNICO","TRIÂNGULO",
"AR CONDICIONADO","LUZES DO PAINEL","FAROL BAIXO","FAROL ALTO",
"LUZ DE RÉ","LUZ DE FREIO","PISCA ALERTA","SETAS",
"PARA-BRISA E VIDROS","PNEUS","CALIBRAGEM PNEUS","ESTEPE",
"RETROVISORES","LENTE DO FAROL","PALHETAS",
"NIVEL DE ÓLEO","FLUÍDO DO RADIADOR","AGUA DO PARA-BRISA",
"LIMPEZA EXTERNA","LIMPEZA INTERNA"
];

let fotosBase64=[];
let pdfBlob=null;

// RENDER
function renderChecklist(){
  checklist.innerHTML="";
  itens.forEach((item,i)=>{
    checklist.innerHTML+=`
      <div id="box${i}" class="item na">
        <label>${item}</label>
        <select id="i${i}" onchange="cor(${i})">
          <option>Aprovado</option>
          <option>Reprovado</option>
          <option>N/A</option>
        </select>
        <textarea id="obs${i}" placeholder="Observação"></textarea>
      </div>
    `;
  });
}
renderChecklist();

// COR DINÂMICA
function cor(i){
  let val=document.getElementById("i"+i).value;
  let box=document.getElementById("box"+i);

  box.classList.remove("aprovado","reprovado","na");

  if(val==="Aprovado") box.classList.add("aprovado");
  else if(val==="Reprovado") box.classList.add("reprovado");
  else box.classList.add("na");
}

// FOTOS
function previewFotos(){
  preview.innerHTML="";
  fotosBase64=[];

  [...fotos.files].forEach(f=>{
    const reader=new FileReader();
    reader.onload=e=>{
      fotosBase64.push(e.target.result);
      preview.innerHTML+=`<img src="${e.target.result}">`;
    }
    reader.readAsDataURL(f);
  });
}

// VALIDAÇÃO
function validar(){
  if(!tipo.value) return "Selecione tipo";
  if(!usuario.value) return "Preencha usuário";
  if(!veiculo.value) return "Preencha veículo";
  if(!placa.value) return "Preencha placa";
  if(!km.value) return "Preencha KM";
  return null;
}

// PDF
async function gerarPDF(){

  let erro=validar();
  if(erro){alert(erro);return;}

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF();

  let y=10;

  pdf.setFontSize(14);
  pdf.text("Relatório de uso de frota",10,y); y+=6;
  pdf.text("Cirurtec Hospitalar Ltda",10,y); y+=10;

  pdf.setFontSize(10);

  pdf.text(`Tipo: ${tipo.value}`,10,y); y+=6;
  pdf.text(`Usuário: ${usuario.value}`,10,y); y+=6;
  pdf.text(`Veículo: ${veiculo.value}`,10,y); y+=6;
  pdf.text(`Placa: ${placa.value}`,10,y); y+=6;
  pdf.text(`KM: ${km.value}`,10,y); y+=6;
  pdf.text(`Data: ${dataHora.value}`,10,y); y+=6;
  pdf.text(`Local: ${local.value}`,10,y); y+=10;

  // CABEÇALHO TABELA
  pdf.text("ITEM",10,y);
  pdf.text("STATUS",120,y);
  pdf.text("OBS",150,y);
  y+=5;

  for(let i=0;i<itens.length;i++){

    let status=document.getElementById("i"+i).value;
    let obs=document.getElementById("obs"+i).value;

    // COR TEXTO
    if(status==="Aprovado") pdf.setTextColor(0,150,0);
    else if(status==="Reprovado") pdf.setTextColor(200,0,0);
    else pdf.setTextColor(0,0,0);

    pdf.text(itens[i],10,y);
    pdf.text(status,120,y);

    pdf.setTextColor(0,0,0);

    if(obs){
      pdf.text(obs,150,y);
    }

    y+=6;

    if(y>270){
      pdf.addPage();
      y=10;
    }
  }

  // FOTOS
  for(let img of fotosBase64){
    pdf.addPage();
    pdf.addImage(img,"JPEG",10,10,180,100);
  }

  pdfBlob=pdf.output("blob");
  pdf.save("Checklist_Frota.pdf");
}

// ENVIAR
async function enviar(){

  if(!pdfBlob){
    alert("Gere o PDF primeiro");
    return;
  }

  const file=new File([pdfBlob],"Checklist_Frota.pdf",{type:"application/pdf"});

  if(navigator.share){
    await navigator.share({
      files:[file],
      title:"Checklist Frota"
    });
  }else{
    alert("Compartilhamento não suportado");
  }
}

</script>

</body>
</html>
